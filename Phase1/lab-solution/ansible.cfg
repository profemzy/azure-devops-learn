[defaults]
# Suppress Python interpreter discovery warning
# Try multiple approaches to suppress the warning

# Option 1: Explicitly set interpreter (should suppress discovery)
ansible_python_interpreter = /usr/bin/python3

# Option 2: Silence warning flag (Ansible 2.20+)
# interpreter_python_auto_silence_warning = True

# Option 3: Disable display_skipped_hosts to reduce output noise
display_skipped_hosts = False

# Option 4: Disable warnings in stderr (last resort)
# display_warnings_to_stderr = False

# Use current directory for inventory
inventory = ./inventory

# Disable host key checking (for lab/testing only)
host_key_checking = False

# Number of parallel processes
forks = 5

# SSH timeout
timeout = 30

# Retry files
retry_files_enabled = False

# Output formatting
# Note: yaml callback requires community.general collection
# Commented out to avoid plugin loading errors
# stdout_callback = yaml
# bin_ansible_callbacks = True

# Display task path
display_ok_hosts = True
display_failed_stats = True

# Fact gathering
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400

[ssh_connection]
# SSH pipelining (faster)
pipelining = True

# Control path for SSH multiplexing
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# SSH connection timeout
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
